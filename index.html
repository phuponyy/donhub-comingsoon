<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(58, 123, 213, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 210, 255, 0.25), transparent 35%),
        #070b18;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      padding: 56px 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #8fdcff;
      font-size: 14px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 84px);
      line-height: 1;
      margin-bottom: 20px;
      letter-spacing: -2px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.76);
      max-width: 560px;
      margin: 0 auto 32px;
    }

    .email {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 14px;
      background: #ffffff;
      color: #07111f;
      text-decoration: none;
      font-weight: 700;
    }

    .footer {
      margin-top: 34px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Website đang được xây dựng</div>
    <h1>Coming Soon</h1>
    <p>
      Chúng tôi đang hoàn thiện website để mang đến trải nghiệm tốt hơn.
      Vui lòng quay lại trong thời gian tới.
    </p>
    <a class="email" href="mailto:contact@yourdomain.com">Liên hệ chúng tôi</a>
    <div class="footer">© 2026 Your Company. All rights reserved.</div>
  </main>
</body>
</html>
